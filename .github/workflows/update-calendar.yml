name: Stundenplan aktualisieren

on:
  schedule:
    # Läuft mehrmals täglich (Uhrzeiten in UTC!). Hier: 5:30, 11:30, 17:30 UTC
    # entspricht in Deutschland (Winterzeit +1 / Sommerzeit +2) ca. 6:30/7:30, 12:30/13:30, 18:30/19:30
    - cron: "30 5 * * *"
    - cron: "30 11 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch: {}   # Erlaubt manuelles Auslösen über den "Run workflow"-Button auf GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4 lxml

      - name: Stundenplan.ics erzeugen
        run: python3 stundenplan_to_ics.py

      - name: Änderungen committen und pushen
        run: |
          git config user.name "stundenplan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stundenplan.ics
          git diff --staged --quiet || git commit -m "Stundenplan aktualisiert"
          git push
